aid: cognitive-space
name: Cognitive Space
description: >-
  Cognitive Space is an aerospace software company delivering AI-powered automated
  satellite operations for constellation and fleet management. Its CNTIENT.Optimize
  platform automates mission planning, tasking, and multi-ground-station pass
  scheduling for satellite operators and government agencies, reporting large per-operator
  time savings, while CNTIENT.Earth delivers satellite Data-as-a-Service. The company
  integrates with customer systems via APIs and serves clients including Terran Orbital,
  the Space Development Agency, the Air Force Research Lab, and NOAA. Backed by Techstars.
